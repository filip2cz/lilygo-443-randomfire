[env:ttgo-lora32-v21]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    olikraus/U8g2 @ ^2.36.18
